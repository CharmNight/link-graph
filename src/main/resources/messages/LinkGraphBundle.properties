plugin.name=链路图
plugin.description=链路图插件：可视化方法、流程与资源链路，支持 Mermaid 导入导出、差异预览、源码跳转、实现建议和可核对的代码 diff。
action.open-link-graph.text=查看当前方法完整链路
action.open-link-graph.description=根据当前光标所在方法提取完整链路并打开链路图工具窗口
action.open-current-node-graph.text=查看当前节点关联图
action.open-current-node-graph.description=根据当前光标所在节点提取关联图并打开链路图工具窗口
action.add-current-method-to-graph.text=添加当前方法到链路图
action.add-current-method-to-graph.description=把当前光标所在方法作为节点追加到链路图画布
action.add-current-node-to-graph.text=添加当前节点到链路图
action.add-current-node-to-graph.description=把当前光标所在资源节点追加到链路图画布
action.open-current-class-diagram.text=打开当前类图
action.open-current-class-diagram.description=以当前光标所在类为中心打开类图
action.import-mermaid.text=导入 Mermaid
action.import-mermaid.description=把 Mermaid 设计图导入到链路图
action.export-mermaid.text=导出 Mermaid
action.export-mermaid.description=把当前设计图导出为 Mermaid 文本
action.show-diff-mode.text=查看 Mermaid 差异
action.show-diff-mode.description=比较导入的 Mermaid 图与提取出的代码图
action.open-link-graph-settings.text=链路图设置
action.open-link-graph-settings.description=打开链路图配置页
dialog.import-mermaid.title=导入 Mermaid
dialog.import-mermaid.message=请输入要导入到编辑器中的 Mermaid 图文本。
dialog.export-mermaid.title=导出 Mermaid
dialog.export-mermaid.copied=Mermaid 文本已复制到剪贴板。
dialog.show-diff-mode.missing-graph=请先加载代码图并导入 Mermaid 图，再查看差异模式。
toolwindow.link-graph.title=链路图
toolwindow.link-graph.placeholder=链路图占位面板
settings.link-graph.display-name=链路图
settings.link-graph.description=配置 Mermaid 同步、实现建议、代码 diff 以及可选的远程 LLM 服务。
settings.link-graph.entry-hint=入口：设置/偏好设置 > 工具 > 链路图，或 工具 > 链路图设置。
settings.link-graph.behavior-hint=默认行为：远程 LLM 关闭。即使关闭，实现建议也会回退到本地规则结果。
settings.link-graph.llm-enabled=启用远程 LLM 辅助
settings.link-graph.llm-enabled.hint=默认：关闭。只有需要启用远程 LLM 参数时再打开。
settings.link-graph.provider=预设
settings.link-graph.provider.hint=默认：{0}。这里选择的是具体 LLM 预设；不同预设会决定协议、默认地址、默认模型和能力。
settings.link-graph.provider.mock=本地规则
settings.link-graph.provider.openai-compatible=通用 OpenAI 兼容
settings.link-graph.provider.openai-responses=通用 OpenAI Responses
settings.link-graph.provider.minimax-openai=MiniMax（OpenAI 兼容）
settings.link-graph.provider.minimax-anthropic=MiniMax（Anthropic 兼容）
settings.link-graph.endpoint=请求地址
settings.link-graph.endpoint.hint=默认：空。若预设内置默认地址会自动使用；OpenAI 兼容会补全 /chat/completions，Anthropic 兼容会补全 /v1/messages。
settings.link-graph.api-key=API 密钥
settings.link-graph.api-key.hint=默认：空。所有远程预设都需要填写。
settings.link-graph.model=模型名
settings.link-graph.model.hint=默认：{0}。留空时会自动回退到这个模型。
settings.link-graph.timeout=超时时间（秒）
settings.link-graph.timeout.hint=默认：{0} 秒。允许范围：{1}-{2} 秒。
settings.link-graph.temperature=温度
settings.link-graph.temperature.hint=默认：{0}。允许范围：0.0-1.0。
settings.link-graph.allow-remote-source-context=允许将源码片段发送给远程 LLM
settings.link-graph.allow-remote-source-context.hint=默认：关闭。开启后，远程 LLM 请求会包含当前收集到的真实源码片段；API 密钥、endpoint 和模型名仍按远程配置发送。
settings.link-graph.attached-jars.title=外部源码与附加 JAR
settings.link-graph.attached-jars.entries=附加 JAR
settings.link-graph.attached-jars.hint=每行一个附加项：class.jar|source.jar|enabled。source.jar 和 enabled 可省略，disabled 可临时停用该项。
settings.link-graph.attached-jars.allow-decompile=允许 class JAR 反编译来源
settings.link-graph.attached-jars.allow-expansion=允许架构索引展开外部库
settings.link-graph.attached-jars.allow-jdk-expansion=允许架构索引展开 JDK 类
settings.link-graph.attached-jars.max-external=最大外部类节点数
settings.link-graph.attached-jars.max-external.hint=默认：3000。0 表示不把外部类加入架构索引，但仍允许显式源码读取。
settings.link-graph.validate=验证远程配置
settings.link-graph.validate.idle=尚未执行远程配置验证。保存时会自动校验当前配置。
settings.link-graph.validate.progress=验证链路图远程 LLM 配置
