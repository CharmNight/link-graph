<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Link Graph 架构图</title>
  <desc id="desc">Link Graph IntelliJ 插件架构图，展示 IDE 入口、Kotlin 后端、图领域层、可选 Agent Runtime、JCEF 运行时边界与 React 工作台。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .cluster { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .clusterTitle { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .boxIde { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; rx: 10; }
      .boxBackend { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.5; rx: 10; }
      .boxDomain { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; rx: 10; }
      .boxAgent { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.5; rx: 10; }
      .boxJcef { fill: #fdf2f8; stroke: #f472b6; stroke-width: 1.5; rx: 10; }
      .boxFrontend { fill: #ecfeff; stroke: #22d3ee; stroke-width: 1.5; rx: 10; }
      .label { font: 600 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 12.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .note { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120" />
  <text x="800" y="48" text-anchor="middle" style="font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#0f172a;">Link Graph 项目架构图</text>
  <text x="800" y="76" text-anchor="middle" style="font: 15px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill:#64748b;">IntelliJ Platform 插件后端 + Agent Runtime + JCEF Bridge + React 图工作台</text>

  <rect class="cluster" x="36" y="116" width="245" height="360" />
  <text class="clusterTitle" x="60" y="151">IntelliJ Platform</text>
  <rect class="boxIde" x="60" y="176" width="197" height="70" />
  <text class="label" x="158" y="204" text-anchor="middle">编辑器与 PSI</text>
  <text class="small" x="158" y="226" text-anchor="middle">当前方法 / 资源上下文</text>
  <rect class="boxIde" x="60" y="266" width="197" height="86" />
  <text class="label" x="158" y="294" text-anchor="middle">插件动作与菜单</text>
  <text class="small" x="158" y="316" text-anchor="middle">打开 / 添加 / 导入</text>
  <text class="small" x="158" y="334" text-anchor="middle">导出 / 差异 / 设置</text>
  <rect class="boxIde" x="60" y="372" width="197" height="70" />
  <text class="label" x="158" y="400" text-anchor="middle">工具窗口与设置</text>
  <text class="small" x="158" y="422" text-anchor="middle">JCEF 容器入口 / LLM 配置</text>

  <rect class="cluster" x="322" y="116" width="380" height="470" />
  <text class="clusterTitle" x="346" y="151">Kotlin 插件后端</text>
  <rect class="boxBackend" x="346" y="176" width="156" height="76" />
  <text class="label" x="424" y="204" text-anchor="middle">GraphEditor</text>
  <text class="label" x="424" y="223" text-anchor="middle">ApplicationService</text>
  <rect class="boxBackend" x="522" y="176" width="156" height="76" />
  <text class="label" x="600" y="204" text-anchor="middle">应用工作流</text>
  <text class="small" x="600" y="226" text-anchor="middle">分析 / 问答 / 草稿</text>
  <rect class="boxBackend" x="346" y="278" width="156" height="76" />
  <text class="label" x="424" y="306" text-anchor="middle">Command Router</text>
  <text class="small" x="424" y="328" text-anchor="middle">前端命令路由</text>
  <rect class="boxBackend" x="522" y="278" width="156" height="76" />
  <text class="label" x="600" y="306" text-anchor="middle">State Service</text>
  <text class="small" x="600" y="328" text-anchor="middle">后端真值状态</text>
  <rect class="boxBackend" x="346" y="380" width="156" height="94" />
  <text class="label" x="424" y="408" text-anchor="middle">页面渲染器</text>
  <text class="small" x="424" y="430" text-anchor="middle">GraphEditorPageRenderer</text>
  <text class="small" x="424" y="448" text-anchor="middle">TransportSliceRenderer</text>
  <rect class="boxBackend" x="522" y="380" width="156" height="94" />
  <text class="label" x="600" y="408" text-anchor="middle">Transport</text>
  <text class="small" x="600" y="430" text-anchor="middle">GraphBrowser</text>
  <text class="small" x="600" y="448" text-anchor="middle">TransportDispatcher</text>
  <text class="note" x="346" y="540">后端保留业务真值，前端消费快照与增量消息。</text>

  <rect class="cluster" x="744" y="116" width="344" height="470" />
  <text class="clusterTitle" x="768" y="151">图与分析领域层</text>
  <rect class="boxDomain" x="768" y="176" width="296" height="64" />
  <text class="label" x="916" y="204" text-anchor="middle">SubjectLocator</text>
  <text class="small" x="916" y="224" text-anchor="middle">光标 / 代码 / 资源主体</text>
  <rect class="boxDomain" x="768" y="258" width="296" height="76" />
  <text class="label" x="916" y="287" text-anchor="middle">SemanticAnalyzer + Provider</text>
  <text class="small" x="916" y="309" text-anchor="middle">Java/Kotlin, MyBatis XML, SQL, YAML, Markdown</text>
  <rect class="boxDomain" x="768" y="352" width="296" height="76" />
  <text class="label" x="916" y="381" text-anchor="middle">AnalysisOutcomeFactory</text>
  <text class="small" x="916" y="403" text-anchor="middle">三视图投影结果</text>
  <rect class="boxDomain" x="768" y="446" width="296" height="64" />
  <text class="label" x="916" y="474" text-anchor="middle">GraphDocument / Patch / Diff</text>
  <text class="small" x="916" y="494" text-anchor="middle">共享图模型</text>
  <rect class="boxDomain" x="768" y="528" width="296" height="40" />
  <text class="label" x="916" y="553" text-anchor="middle">Mermaid / Diff / Sync / Navigation</text>

  <rect class="cluster" x="1130" y="116" width="430" height="470" />
  <text class="clusterTitle" x="1154" y="151">可选 LLM 与 Agent Runtime</text>
  <rect class="boxAgent" x="1154" y="176" width="170" height="74" />
  <text class="label" x="1239" y="204" text-anchor="middle">RoutingLlmGateway</text>
  <text class="small" x="1239" y="226" text-anchor="middle">远程 Provider + 回退</text>
  <rect class="boxAgent" x="1356" y="176" width="170" height="74" />
  <text class="label" x="1441" y="204" text-anchor="middle">Agent Runtime</text>
  <text class="small" x="1441" y="226" text-anchor="middle">RunCoordinator / Context</text>
  <rect class="boxAgent" x="1154" y="280" width="170" height="82" />
  <text class="label" x="1239" y="309" text-anchor="middle">Capability</text>
  <text class="small" x="1239" y="331" text-anchor="middle">Qa / Suggestion / Diff</text>
  <rect class="boxAgent" x="1356" y="280" width="170" height="82" />
  <text class="label" x="1441" y="309" text-anchor="middle">Tool Facade</text>
  <text class="small" x="1441" y="331" text-anchor="middle">图 / 草稿 / 代码 / 证据</text>
  <rect class="boxAgent" x="1255" y="394" width="170" height="82" />
  <text class="label" x="1340" y="423" text-anchor="middle">ArtifactStore</text>
  <text class="small" x="1340" y="445" text-anchor="middle">Intent / Suggestion / CodeDiff</text>
  <text class="note" x="1154" y="540">远程能力可选；失败或未配置时回退到本地规则/模板。</text>

  <rect class="cluster" x="322" y="668" width="380" height="300" />
  <text class="clusterTitle" x="346" y="703">JCEF 运行时边界</text>
  <text class="note" x="346" y="727">运行时边界，相关代码主要位于 Kotlin 后端 ui 包。</text>
  <rect class="boxJcef" x="346" y="754" width="156" height="70" />
  <text class="label" x="424" y="782" text-anchor="middle">GraphBrowserPanel</text>
  <text class="small" x="424" y="804" text-anchor="middle">JBCefBrowser 容器</text>
  <rect class="boxJcef" x="522" y="754" width="156" height="70" />
  <text class="label" x="600" y="782" text-anchor="middle">Bridge Registrar</text>
  <text class="small" x="600" y="804" text-anchor="middle">window.linkGraphBridge</text>
  <rect class="boxJcef" x="434" y="852" width="156" height="70" />
  <text class="label" x="512" y="880" text-anchor="middle">GraphEditorBridge</text>
  <text class="small" x="512" y="902" text-anchor="middle">消息入口</text>

  <rect class="cluster" x="744" y="668" width="816" height="300" />
  <text class="clusterTitle" x="768" y="703">React + Vite 工作台</text>
  <rect class="boxFrontend" x="768" y="738" width="172" height="64" />
  <text class="label" x="854" y="766" text-anchor="middle">Bootstrap</text>
  <text class="small" x="854" y="786" text-anchor="middle">Transport 消费</text>
  <rect class="boxFrontend" x="968" y="738" width="172" height="64" />
  <text class="label" x="1054" y="766" text-anchor="middle">App.tsx</text>
  <text class="small" x="1054" y="786" text-anchor="middle">工作台外壳</text>
  <rect class="boxFrontend" x="1168" y="738" width="172" height="64" />
  <text class="label" x="1254" y="766" text-anchor="middle">controllers</text>
  <text class="small" x="1254" y="786" text-anchor="middle">命令 + 状态转换</text>
  <rect class="boxFrontend" x="1360" y="738" width="172" height="64" />
  <text class="label" x="1446" y="766" text-anchor="middle">前端 Store</text>
  <text class="small" x="1446" y="786" text-anchor="middle">工作台状态</text>
  <rect class="boxFrontend" x="832" y="844" width="210" height="68" />
  <text class="label" x="937" y="872" text-anchor="middle">views</text>
  <text class="small" x="937" y="894" text-anchor="middle">事实图 / 流程图 / 资源</text>
  <rect class="boxFrontend" x="1080" y="844" width="210" height="68" />
  <text class="label" x="1185" y="872" text-anchor="middle">React Flow + ELK</text>
  <text class="small" x="1185" y="894" text-anchor="middle">图画布 + 自动布局</text>
  <rect class="boxFrontend" x="1328" y="844" width="204" height="68" />
  <text class="label" x="1430" y="872" text-anchor="middle">workbench 面板</text>
  <text class="small" x="1430" y="894" text-anchor="middle">证据 / 问答 / 讲解 / 草稿 / 代码</text>

